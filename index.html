<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Messages!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-elements">
        <!-- Floating shapes -->
        <div class="shape circle-1"></div>
        <div class="shape circle-2"></div>
        <div class="shape star-1">★</div>
        <div class="shape star-2">★</div>
        <div class="shape cloud-1">☁️</div>
        <div class="shape cloud-2">☁️</div>
    </div>

    <main class="container">
        <h1 class="main-title">Welcome to the Magic Message Box! ✨</h1>
        <p class="subtitle">Click the button below to see more messages!</p>
        <button id="open-btn" class="cute-btn">Open the message!</button>
    </main>

    <!-- Modal Background -->
    <div id="modal-bg" class="modal-bg">
        <!-- Modal Content -->
        <div id="modal-content" class="modal-content">
            <button id="close-btn" class="close-btn">&times;</button>
            <div class="modal-header">
                <span class="emoji" id="modal-emoji">🎉</span>
            </div>
            <h2 id="modal-title" class="modal-title">Hello!</h2>
            <p id="modal-message" class="modal-text">Welcome to PH ASMAT Aksentuasi 2026!</p>
            <button id="next-btn" class="cute-btn small-btn">Next Message!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
